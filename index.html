<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ZIPA POKER 設計審閱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=IBM+Plex+Mono:wght@500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Values copied from tokens/colors.css; this page ships alone, so it cannot link the tokens. */
:root{
  --blue-700:#0D4C87; --blue-900:#16307A; --red-600:#C6402E; --white:#FFFFFF;
  --night-900:#12172E; --ink-900:#101418; --ink-700:#43484F; --ink-500:#5C6169;
  --line-300:#D9DBD6; --paper-200:#EDEEEB;
  --font-display:'Barlow Condensed',sans-serif; --font-zh:'Noto Sans TC',sans-serif; --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper-200);color:var(--ink-900);font:400 16px/1.7 var(--font-zh)}
.mono{font:500 12px/1.2 var(--font-mono);letter-spacing:.14em;text-transform:uppercase}

/* Gate */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
#gate form{width:100%;max-width:360px;background:var(--white);border:1px solid var(--line-300);border-top:6px solid var(--blue-700);padding:32px 28px;display:flex;flex-direction:column;gap:14px}
#gate h1{margin:0;font:700 24px/1.3 var(--font-zh);letter-spacing:.02em}
#gate .mono{color:var(--blue-700)}
#gate input{height:48px;padding:0 14px;border:1px solid var(--line-300);border-radius:0;font:500 18px/1 var(--font-mono);letter-spacing:.1em}
#gate input:focus{outline:2px solid var(--blue-700);outline-offset:-1px}
#gate button{height:48px;border:0;border-radius:0;background:var(--blue-700);color:var(--white);font:700 16px/1 var(--font-zh);letter-spacing:.04em;cursor:pointer}
#gate button:hover{background:var(--blue-900)}
#gate button:disabled{opacity:.5;cursor:progress}
#err{min-height:1.4em;margin:0;color:var(--red-600);font:700 14px/1.4 var(--font-zh)}

/* Content */
#app{display:none;padding:0 0 80px}
.wrap{max-width:1520px;margin:0 auto;padding:0 16px}
header.top{display:flex;flex-direction:column;gap:10px;padding-top:40px;padding-bottom:24px}
header.top h1 span{display:inline-block}
header.top h1{margin:0;font:700 32px/1.25 var(--font-zh);letter-spacing:.02em}
header.top .bar{width:96px;height:6px;background:var(--red-600)}
header.top p{margin:0;color:var(--ink-700);max-width:64ch}
nav{position:sticky;top:0;z-index:5;background:var(--white);border-bottom:1px solid var(--line-300)}
nav .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav .wrap::-webkit-scrollbar{display:none}
nav a{flex:none;display:flex;align-items:center;height:48px;padding:0 12px;color:var(--ink-700);font:500 15px/1 var(--font-zh);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap}
nav a.on{color:var(--blue-700);font-weight:700;border-bottom-color:var(--blue-700)}
section{padding-top:40px;scroll-margin-top:48px}
section > .mono{color:var(--blue-700)}
section h2{margin:8px 0 6px;font:700 26px/1.3 var(--font-zh);letter-spacing:.02em}
section > p{margin:0 0 24px;color:var(--ink-700);max-width:64ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:32px 24px}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(min(100%,560px),1fr))}
figure{margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
figure figcaption{color:var(--ink-500)}
figure img{display:block;width:100%;height:auto;background:var(--white);border:1px solid var(--line-300);cursor:zoom-in}

/* Lightbox: wide images scroll sideways on a phone instead of shrinking to unreadable. */
#lb{position:fixed;inset:0;background:color-mix(in srgb,var(--ink-900) 92%,transparent);display:none;overflow:auto;z-index:10;-webkit-overflow-scrolling:touch}
#lb.on{display:block}
#lb .stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding:56px 16px 24px;box-sizing:border-box}
#lb img{display:block;max-width:100%;max-height:calc(100vh - 80px);width:auto;height:auto}
#lb.wide .stage{width:max-content;min-width:100%}
#lb.wide img{max-width:none;max-height:none;width:max(calc(100vw - 32px),900px)}
#lb button{position:fixed;top:8px;right:8px;width:44px;height:44px;border:0;border-radius:0;background:var(--white);color:var(--ink-900);font:500 22px/1 var(--font-mono);cursor:pointer;z-index:11}
@media (max-width:560px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 12px}
  .grid.wide{grid-template-columns:minmax(0,1fr)}
  header.top{padding-top:28px}
  header.top h1{font-size:24px}
  section h2{font-size:21px}
  section > p{font-size:15px}
  figure figcaption{font-size:11px;letter-spacing:.08em}
}
</style>
</head>
<body>
<div id="gate">
  <form id="f" autocomplete="off">
    <span class="mono">ZIPA POKER · REVIEW</span>
    <h1>請輸入通關碼</h1>
    <input id="pw" type="password" aria-label="通關碼" autofocus>
    <p id="err" role="alert"></p>
    <button id="go" type="submit">進入</button>
  </form>
</div>
<main id="app"></main>
<div id="lb" role="dialog" aria-label="放大檢視"><button type="button" aria-label="關閉">×</button><div class="stage"><img alt=""></div></div>
<script>
(() => {
  const KEY = 'zipa-review-pass';
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  let payload = null;

  async function load() {
    if (!payload) payload = await (await fetch('payload.json', { cache: 'no-cache' })).json();
    return payload;
  }

  async function decrypt(pass) {
    const p = await load();
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', hash: 'SHA-256', salt: b64(p.salt), iterations: p.iter },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(p.iv) }, key, b64(p.data));
    return JSON.parse(new TextDecoder().decode(plain));
  }

  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  function render(doc) {
    const app = document.getElementById('app');
    const head = el('header', 'top wrap');
    // Title parts separated by a full-width space stay whole when the line wraps.
    const h1 = el('h1');
    doc.title.split('　').forEach((t, i) => { if (i) h1.append('　'); h1.append(el('span', null, t)); });
    head.append(el('span', 'mono', doc.kicker), h1, el('div', 'bar'));
    if (doc.desc) head.append(el('p', null, doc.desc));
    const nav = el('nav'), navIn = el('div', 'wrap');
    nav.append(navIn);
    const main = el('div', 'wrap');
    app.append(head, nav, main);
    doc.sections.forEach((s, i) => {
      const sec = el('section');
      sec.id = 's' + (i + 1);
      sec.append(el('span', 'mono', s.kicker), el('h2', null, s.title));
      if (s.desc) sec.append(el('p', null, s.desc));
      const grid = el('div', s.items.every(it => it.kind === 'wide') ? 'grid wide' : 'grid');
      for (const it of s.items) {
        const fig = el('figure');
        const img = el('img');
        img.src = 'data:image/png;base64,' + it.img;
        img.alt = it.label;
        img.loading = 'lazy';
        img.dataset.kind = it.kind;
        fig.append(img, el('figcaption', 'mono', it.label));
        grid.append(fig);
      }
      sec.append(grid);
      main.append(sec);
      const a = el('a', null, s.nav);
      a.href = '#' + sec.id;
      navIn.append(a);
    });
    // Highlight the section in view and keep its tab visible in the scrolling nav.
    const links = [...navIn.children];
    const io = new IntersectionObserver(entries => {
      for (const e of entries) if (e.isIntersecting) {
        links.forEach(l => l.classList.toggle('on', l.hash === '#' + e.target.id));
        const on = links.find(l => l.classList.contains('on'));
        if (on) navIn.scrollTo({ left: on.offsetLeft - 16, behavior: 'smooth' });
      }
    }, { rootMargin: '-49px 0px -70% 0px' });
    main.querySelectorAll('section').forEach(s => io.observe(s));
    document.getElementById('gate').style.display = 'none';
    app.style.display = 'block';
  }

  async function unlock(pass, quiet) {
    const btn = document.getElementById('go'), err = document.getElementById('err');
    btn.disabled = true; err.textContent = '';
    try {
      render(await decrypt(pass));
      try { sessionStorage.setItem(KEY, pass); } catch (e) {}
    } catch (e) {
      if (!quiet) err.textContent = e instanceof DOMException ? '通關碼不正確' : '載入失敗，請重新整理';
      try { sessionStorage.removeItem(KEY); } catch (e2) {}
    } finally { btn.disabled = false; }
  }

  document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); unlock(document.getElementById('pw').value, false); });

  const lb = document.getElementById('lb');
  const close = () => { lb.classList.remove('on'); document.body.style.overflow = ''; };
  document.addEventListener('click', e => {
    if (e.target.matches('figure img')) {
      lb.querySelector('img').src = e.target.src;
      lb.classList.toggle('wide', e.target.dataset.kind === 'wide');
      lb.classList.add('on');
      lb.scrollTo(0, 0);
      document.body.style.overflow = 'hidden';
    } else if (lb.contains(e.target) && (e.target === lb || e.target.matches('button, .stage'))) close();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

  let saved = null;
  try { saved = sessionStorage.getItem(KEY); } catch (e) {}
  if (saved) unlock(saved, true);
})();
</script>
</body>
</html>
